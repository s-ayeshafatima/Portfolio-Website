name: Linting Check

on:
  pull_request:
    branches: [ develop ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Run HTMLHint
      run: npx htmlhint "src/**/*.html"

    - name: Run Stylelint
      run: npx stylelint "styles/**/*.css"
